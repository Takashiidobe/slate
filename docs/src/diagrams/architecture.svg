<svg xmlns="http://www.w3.org/2000/svg" width="576" height="100" viewBox="0 0 576 100" role="img" aria-labelledby="title description">
  <title id="title">Slate translation pipeline</title>
  <desc id="description">Slate-parser goes from C to IR, slate-analysis from IR to IR, and Slate's lowerer from IR to Rust.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4338ca"/>
    </marker>
  </defs>
  <rect width="576" height="100" rx="12" fill="#f8fafc"/>
  <g fill="#eef2ff" stroke="#4338ca">
    <rect x="12" y="14" width="168" height="72" rx="8"/>
    <rect x="204" y="14" width="168" height="72" rx="8"/>
    <rect x="396" y="14" width="168" height="72" rx="8"/>
  </g>
  <g fill="none" stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M181 50H200"/>
    <path d="M373 50H392"/>
  </g>
  <g font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1e1b4b">
    <g font-size="18" font-weight="600">
      <text x="96" y="45">slate-parser</text>
      <text x="288" y="45">slate-analysis</text>
      <text x="480" y="45">slate (lowerer)</text>
    </g>
    <text x="96" y="66">C → IR</text>
    <text x="288" y="66">IR → IR</text>
    <text x="480" y="66">IR → Rust</text>
  </g>
</svg>
