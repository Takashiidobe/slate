<svg xmlns="http://www.w3.org/2000/svg" width="576" height="100" viewBox="0 0 576 100" role="img" aria-labelledby="title description">
  <title id="title">Slate IR pipeline</title>
  <desc id="description">Sema emits IR. Slate transforms it, computes facts, and lowers it to Rust.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#4338ca"/>
    </marker>
  </defs>
  <rect width="576" height="100" rx="12" fill="#f8fafc"/>
  <g fill="#eef2ff" stroke="#4338ca">
    <rect x="12" y="22" width="120" height="56" rx="8"/>
    <rect x="156" y="22" width="120" height="56" rx="8"/>
    <rect x="300" y="22" width="120" height="56" rx="8"/>
    <rect x="444" y="22" width="120" height="56" rx="8"/>
  </g>
  <g stroke="#4338ca" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M133 50H152"/>
    <path d="M277 50H296"/>
    <path d="M421 50H440"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle" fill="#1e1b4b">
    <g font-size="13" font-weight="600">
      <text x="72" y="46">IR</text>
      <text x="216" y="46">Transforms</text>
      <text x="360" y="46">Analysis</text>
      <text x="504" y="46">Rust lowering</text>
    </g>
    <g font-size="11">
      <text x="72" y="63">Sema emits</text>
      <text x="216" y="63">Simplify IR</text>
      <text x="360" y="63">Compute facts</text>
      <text x="504" y="63">Read IR and facts</text>
    </g>
  </g>
</svg>
