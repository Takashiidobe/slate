experimental = ["setup-scripts"]

[profile.slate]
default-filter = 'package(slate-c2rust)'

[profile.parser]
default-filter = 'package(slate-parser)'

[scripts.setup.target-i686]
command = ["sh", "-c", "echo SLATE_TEST_TARGETS=i686-unknown-linux-gnu >> \"$NEXTEST_ENV\""]

[scripts.setup.target-aarch64]
command = ["sh", "-c", "echo SLATE_TEST_TARGETS=aarch64-unknown-linux-gnu >> \"$NEXTEST_ENV\""]

[scripts.setup.target-arm]
command = ["sh", "-c", "echo SLATE_TEST_TARGETS=armv7-unknown-linux-gnueabihf >> \"$NEXTEST_ENV\""]

[scripts.setup.target-all]
command = ["sh", "-c", "echo SLATE_TEST_TARGETS=x86_64-unknown-linux-gnu,i686-unknown-linux-gnu,aarch64-unknown-linux-gnu,armv7-unknown-linux-gnueabihf >> \"$NEXTEST_ENV\""]

[profile.slate-i686]
default-filter = 'package(slate-c2rust) & (test(=generated_differential) | test(=fixtures_unsupported_tests_still_fail))'

[[profile.slate-i686.scripts]]
filter = 'test(=generated_differential) | test(/^fixtures_unsupported_/)'
setup = "target-i686"

[profile.slate-aarch64]
default-filter = 'package(slate-c2rust) & (test(=generated_differential) | test(=fixtures_unsupported_tests_still_fail))'

[[profile.slate-aarch64.scripts]]
filter = 'test(=generated_differential) | test(/^fixtures_unsupported_/)'
setup = "target-aarch64"

[profile.slate-arm]
default-filter = 'package(slate-c2rust) & (test(=generated_differential) | test(=fixtures_unsupported_tests_still_fail))'

[[profile.slate-arm.scripts]]
filter = 'test(=generated_differential) | test(/^fixtures_unsupported_/)'
setup = "target-arm"

[profile.slate-targets]
default-filter = 'package(slate-c2rust) & (test(=generated_differential) | test(=fixtures_unsupported_tests_still_fail))'

[[profile.slate-targets.scripts]]
filter = 'test(=generated_differential) | test(/^fixtures_unsupported_/)'
setup = "target-all"

[[profile.default.overrides]]
filter = 'test(gcc_torture_supported_tests_match_c)'
threads-required = "num-test-threads"
priority = 100

[[profile.default.overrides]]
filter = 'test(generated_differential)'
priority = 90

[[profile.default.overrides]]
filter = 'test(c_testsuite_supported_tests_match_c)'
priority = 80

[[profile.default.overrides]]
filter = 'test(generated_differential) + test(c_testsuite_supported_tests_match_c)'
threads-required = 3

[scripts.setup.flavor-clang]
command = ["sh", "-c", "echo SLATE_DIFF_FLAVOR=clang >> \"$NEXTEST_ENV\"; echo SLATE_TEST_TARGETS=x86_64-unknown-linux-gnu,i686-unknown-linux-gnu,aarch64-unknown-linux-gnu >> \"$NEXTEST_ENV\""]

[profile.clang]
default-filter = '(package(slate-c2rust) & (test(=generated_differential) | test(=fixtures_unsupported_tests_still_fail))) | (package(slate-parser) & test(/^(error\/|suites\/[^\/]+\/)?clang\//))'

[[profile.clang.scripts]]
filter = 'package(slate-c2rust) & (test(=generated_differential) | test(/^fixtures_unsupported_/))'
setup = "flavor-clang"

[scripts.setup.flavor-gcc]
command = ["sh", "-c", "echo SLATE_DIFF_FLAVOR=gcc >> \"$NEXTEST_ENV\"; echo SLATE_TEST_TARGETS=x86_64-unknown-linux-gnu,i686-unknown-linux-gnu,aarch64-unknown-linux-gnu >> \"$NEXTEST_ENV\""]

[profile.gcc]
default-filter = '(package(slate-c2rust) & (test(=generated_differential) | test(=fixtures_unsupported_tests_still_fail))) | (package(slate-parser) & test(/^(error\/|suites\/[^\/]+\/)?gcc\//))'

[[profile.gcc.scripts]]
filter = 'package(slate-c2rust) & (test(=generated_differential) | test(/^fixtures_unsupported_/))'
setup = "flavor-gcc"

[scripts.setup.flavor-msvc]
command = ["sh", "-c", "echo SLATE_DIFF_FLAVOR=msvc >> \"$NEXTEST_ENV\"; echo SLATE_TEST_TARGETS=x86_64-unknown-linux-gnu,i686-unknown-linux-gnu,aarch64-unknown-linux-gnu >> \"$NEXTEST_ENV\""]

[profile.msvc]
default-filter = '(package(slate-c2rust) & (test(=generated_differential) | test(=fixtures_unsupported_tests_still_fail))) | (package(slate-parser) & test(/^(error\/|suites\/[^\/]+\/)?msvc\//))'

[[profile.msvc.scripts]]
filter = 'package(slate-c2rust) & (test(=generated_differential) | test(/^fixtures_unsupported_/))'
setup = "flavor-msvc"
