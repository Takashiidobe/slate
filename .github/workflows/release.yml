name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Check tag and published versions
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          crates=(slate-parser slate-sysroots slate-c2rust)
          for crate in "${crates[@]}"; do
            crate_version="$(jq -er --arg crate "$crate" '.packages[] | select(.name == $crate) | .version' <<< "$metadata")"
            if [ "$GITHUB_REF_NAME" != "v$crate_version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $crate Cargo.toml version $crate_version" >&2
              exit 1
            fi
          done

          pending=()
          encoded_version="$(jq -rn --arg v "$tag_version" '$v|@uri')"
          for crate in "${crates[@]}"; do
            status="$(curl -A "slate-release-workflow" --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/$crate/$encoded_version")"
            if [ "$status" = "200" ]; then
              echo "$crate $tag_version already exists on crates.io; skipping publish."
            elif [ "$status" = "404" ]; then
              echo "$crate $tag_version has not been published yet."
              pending+=("$crate")
            else
              echo "Unexpected crates.io response while checking $crate $tag_version: HTTP $status" >&2
              exit 1
            fi
          done
          echo "crates=${pending[*]}" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.version.outputs.crates != ''

      - name: Publish crates in dependency order
        if: steps.version.outputs.crates != ''
        shell: bash
        run: |
          read -r -a crates <<< "$RELEASE_CRATES"
          for crate in "${crates[@]}"; do
            cargo publish -p "$crate" --all-features --locked
          done
        env:
          RELEASE_CRATES: ${{ steps.version.outputs.crates }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  release:
    needs: publish
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Create release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi

  netlify:
    needs: release
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "Set the NETLIFY_AUTH_TOKEN repository or release environment secret." >&2
            exit 1
          fi

      - name: Install WASI target
        run: rustup target add wasm32-wasip1

      - name: Install demo headers
        run: |
          cargo build --release --locked -p slate-c2rust
          target/test-cache/release/slate sysroot install compiler-headers clang
          target/test-cache/release/slate sysroot install compiler-headers gcc
          for target in x86_64-unknown-linux-gnu i686-unknown-linux-gnu armv7-unknown-linux-gnueabihf aarch64-unknown-linux-gnu; do
            target/test-cache/release/slate sysroot install "$target"
          done

      - name: Build browser demos
        run: |
          bash www/build.sh
          bash www-parser/build.sh

      - name: Deploy Slate demo
        working-directory: www
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: f80be58c-fd1e-4031-a180-d2d59cea57a9
        run: npx --yes netlify-cli@latest deploy --dir dist --prod --no-build

      - name: Deploy parser explorer
        working-directory: www-parser
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: f5acfa31-ee87-4344-b89e-0be687d6db33
        run: npx --yes netlify-cli@latest deploy --dir dist --prod --no-build

  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-26-intel
            target: x86_64-apple-darwin
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: slate
          manifest-path: crates/slate/Cargo.toml
          target: ${{ matrix.target }}
          archive: slate-c2rust-$target-$tag
          locked: true
          tar: all
          zip: none
          include: LICENSE-APACHE,LICENSE-MIT
          checksum: sha256

      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: slate-parser
          manifest-path: crates/slate-parser/Cargo.toml
          target: ${{ matrix.target }}
          archive: slate-parser-$target-$tag
          locked: true
          tar: all
          zip: none
          include: LICENSE-APACHE,LICENSE-MIT
          checksum: sha256
