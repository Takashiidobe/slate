name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: crates-io-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - name: Check tag and published versions
        id: version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          metadata="$(cargo metadata --locked --no-deps --format-version 1)"
          crates=(slate-parser slate-sysroots slate-c2rust)
          for crate in "${crates[@]}"; do
            crate_version="$(jq -er --arg crate "$crate" '.packages[] | select(.name == $crate) | .version' <<< "$metadata")"
            if [ "$GITHUB_REF_NAME" != "v$crate_version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match $crate Cargo.toml version $crate_version" >&2
              exit 1
            fi
          done

          pending=()
          encoded_version="$(jq -rn --arg v "$tag_version" '$v|@uri')"
          for crate in "${crates[@]}"; do
            status="$(curl -A "slate-release-workflow" --silent --show-error --retry 3 --output /dev/null --write-out '%{http_code}' "https://crates.io/api/v1/crates/$crate/$encoded_version")"
            if [ "$status" = "200" ]; then
              echo "$crate $tag_version already exists on crates.io; skipping publish."
            elif [ "$status" = "404" ]; then
              echo "$crate $tag_version has not been published yet."
              pending+=("$crate")
            else
              echo "Unexpected crates.io response while checking $crate $tag_version: HTTP $status" >&2
              exit 1
            fi
          done
          echo "crates=${pending[*]}" >> "$GITHUB_OUTPUT"

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: steps.version.outputs.crates != ''

      - name: Publish crates in dependency order
        if: steps.version.outputs.crates != ''
        shell: bash
        run: |
          read -r -a crates <<< "$RELEASE_CRATES"
          for crate in "${crates[@]}"; do
            cargo publish -p "$crate" --all-features --locked
          done
        env:
          RELEASE_CRATES: ${{ steps.version.outputs.crates }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  binaries:
    needs: publish
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --release --locked --target ${{ matrix.target }} -p slate-c2rust -p slate-parser --bins

      - name: Package release binaries
        shell: bash
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          suffix=""
          if [[ "$RELEASE_TARGET" == *-windows-* ]]; then
            suffix=".exe"
          fi
          mkdir -p dist
          for package in slate-c2rust slate-parser; do
            binary="$package"
            if [ "$package" = "slate-c2rust" ]; then
              binary="slate"
            fi
            staging="dist/$package"
            mkdir -p "$staging"
            cp "target/test-cache/$RELEASE_TARGET/release/$binary$suffix" "$staging/"
            cp LICENSE-APACHE LICENSE-MIT "$staging/"
            tar -czf "dist/$package-$RELEASE_TARGET-v$version.tar.gz" -C "$staging" "$binary$suffix" LICENSE-APACHE LICENSE-MIT
          done

      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: dist
          merge-multiple: true

      - name: Publish release archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --verify-tag --generate-notes
          fi
