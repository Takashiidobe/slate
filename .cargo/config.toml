[build]
# Use a shared, stable target directory for test runs to keep incremental
# artifacts bounded and cacheable. This avoids creating per-run target
# trees that balloon disk usage.
target-dir = "target/test-cache"

[target.'cfg(target_os = "freebsd")']
rustflags = ['--cfg=libc_unstable_freebsd_version="15"']

[target.'cfg(all(target_os = "linux", target_env = "gnu", target_pointer_width = "32"))']
rustflags = ['--cfg=libc_unstable_gnu_time_bits="64"']
