[package]
name = "slate-cargo-toml"
version = "0.9.0"
edition = "2024"
description = "Typed Cargo.toml and .cargo/config.toml models for Slate's generated crates"
license.workspace = true
repository.workspace = true
keywords = ["cargo", "manifest", "toml"]
categories = ["development-tools::build-utils"]
include = ["/src", "/LICENSE-*"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
