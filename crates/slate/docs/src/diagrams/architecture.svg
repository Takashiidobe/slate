<text x="107.5" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">slate-sysroots</text>
<path d="M195 95H210" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="215" y="50" width="175" height="90" rx="8" fill="#eef2ff" stroke="#4338ca"/>
<text x="302.5" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e1b4b">Preprocess, parse, sema</text>
<text x="302.5" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">slate-parser</text>
<path d="M390 95H405" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="410" y="50" width="175" height="90" rx="8" fill="#eef2ff" stroke="#4338ca"/>
<text x="497.5" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e1b4b">Typed IR to Rust AST</text>
<text x="497.5" y="110" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Slate frontend</text>
<path d="M585 95H600" stroke="#4338ca" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="605" y="50" width="175" height="90" rx="8" fill="#eef2ff" stroke="#4338ca"/>
<text x="692.5" y="83" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#1e1b4b">Rewrites and emission</text>
