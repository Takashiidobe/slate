[profile.libc]
default-filter = '''
  binary_id(=slate::libc_shim_suite)
  + binary_id(=slate::libc_test_api_suite)
  + binary_id(=slate::libc_test_functional_suite)
  + binary_id(=slate::header_compilation)
'''

[profile.rewrites]
default-filter = '''
  not (
    binary_id(=slate::libc_shim_suite)
    + binary_id(=slate::libc_test_api_suite)
    + binary_id(=slate::libc_test_functional_suite)
    + binary_id(=slate::header_compilation)
  )
'''

[profile.lowering]
default-filter = '''
  test(generated_differential)
  + test(generated_cross_tu_filecheck)
  + test(generated_library_filecheck)
  + test(c_testsuite_supported_tests_match_c)
  + test(chibicc_supported_tests_match_c)
  + test(chibicc_unsupported_tests_still_fail)
  + test(gcc_torture_supported_tests_match_c)
  + test(gcc_torture_unsupported_tests_still_fail)
  + test(gcc_dg_c23_supported_tests_match_c)
  + test(gcc_dg_c23_unsupported_tests_still_fail)
  + test(libc_test_functional_supported_tests_match_c)
  + test(stdlib_coverage)
'''

[[profile.default.overrides]]
filter = 'test(serial_temp_chain_translates_within_a_bounded_time)'
threads-required = "num-test-threads"

[[profile.default.overrides]]
filter = 'test(gcc_torture_supported_tests_match_c)'
threads-required = "num-test-threads"
priority = 100

[[profile.default.overrides]]
filter = 'test(generated_differential)'
priority = 90

[[profile.default.overrides]]
filter = 'test(libc_test_functional_supported_tests_match_c)'
priority = 80

[[profile.default.overrides]]
filter = 'test(c_testsuite_supported_tests_match_c)'
priority = 70

[[profile.default.overrides]]
filter = 'test(chibicc_supported_tests_match_c)'
priority = 60

[[profile.default.overrides]]
filter = 'test(stdlib_coverage)'
priority = 50

[[profile.default.overrides]]
filter = 'test(chibicc_unsupported_tests_still_fail)'
priority = 40

[[profile.default.overrides]]
filter = '''
  test(generated_differential)
  + test(c_testsuite_supported_tests_match_c)
  + test(chibicc_supported_tests_match_c)
  + test(chibicc_unsupported_tests_still_fail)
  + test(gcc_torture_supported_tests_match_c)
  + test(libc_test_api_supported_tests_compile)
  + test(libc_test_functional_supported_tests_match_c)
  + test(stdlib_coverage)
  + test(directive_translated_fixtures_compile_for_current_host)
'''
threads-required = 3
