[package]
name = "slate"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
shlex = "2"
thiserror = "2.0.19"
salsa = "0.28"
ordered-float = "5.3.0"
triplers = { version = "0.1.1", path = "vendor/triplers" }
mimalloc = "0.1.52"

[[test]]
name = "alive_regression"
path = "tests/alive_regression.rs"
test = false

[[test]]
name = "effects_regression"
path = "tests/effects_regression.rs"
test = false

[[test]]
name = "c_testsuite_suite"
path = "tests/c_testsuite_suite.rs"
test = false

[profile.test]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[lints.clippy]
large_enum_variant = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
