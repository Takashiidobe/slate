[package]
name = "slate"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde_json = "1"
thiserror = "2.0.19"

[[test]]
name = "alive_regression"
path = "tests/alive_regression.rs"
test = false

[[test]]
name = "effects_regression"
path = "tests/effects_regression.rs"
test = false

[profile.dev]
opt-level = 3
overflow-checks = false
