[package]
name = "slate-parser"
version = "0.1.0"
edition = "2024"
description = "C preprocessor, parser, semantic analysis, and typed IR for Slate"
license.workspace = true
repository.workspace = true
keywords = ["c", "parser", "compiler", "preprocessor"]
categories = ["compilers", "parser-implementations"]
include = ["/src", "/README.md", "/LICENSE-*"]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }-v{ version }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[dependencies]
custom_debug.workspace = true
directories.workspace = true
foldhash.workspace = true
libc.workspace = true
miette.workspace = true
num-bigint.workspace = true
rustc_apfloat.workspace = true
thiserror.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3"

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
clang-ast.workspace = true
tempfile.workspace = true
libtest-mimic.workspace = true

[lints.clippy]
large_enum_variant = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
result_large_err = "allow"

[[test]]
name = "filecheck"
harness = false
