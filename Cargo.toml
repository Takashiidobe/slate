[workspace]
members = ["crates/slate", "crates/slate-parser", "crates/slate-sysroots", "crates/slate-intrinsic-gen"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
ar = "0.9"
clang-ast = "0.1"
clap = "4"
custom_debug = "0.6.2"
directories = "6.0.0"
foldhash = "0.2"
indicatif = "0.18"
libc = "0.2"
libtest-mimic = "0.8"
miette = { version = "7", features = ["fancy"] }
mimalloc = "0.1.52"
num-bigint = "0.5"
ordered-float = "5.3.0"
prettyplease = "0.3"
rayon = "1.12"
rustc_apfloat = "0.2.3"
serde = "1"
serde_json = "1"
sha2 = "0.10"
shlex = "2"
slate-parser = { path = "crates/slate-parser" }
slate-sysroots = { path = "crates/slate-sysroots" }
syn = { version = "3", default-features = false }
tar = "0.4"
tempfile = "3"
thiserror = "2.0.19"
ureq = "3.4"
xwin = "0.10"
xz2 = "0.1"
zip = { version = "2.4.2", default-features = false }

[profile.test]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16
