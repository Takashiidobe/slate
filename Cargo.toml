[package]
name = "slate"
version = "0.1.0"
edition = "2024"
default-run = "slate"

[dependencies]
libc = "0.2"
serde = "1"
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
shlex = "2"
salsa = "0.28"
thiserror = "2.0.19"
ordered-float = "5.3.0"
triplers = { version = "0.1.1", path = "vendor/triplers" }
mimalloc = "0.1.52"
rustc_apfloat = "0.2.3"
unicode-ident = "1"
clang-ir = { path = "../clang-ir/clang-ir" }

[patch.crates-io]
clang-ir-types = { path = "../clang-ir/clang-ir-types" }

[profile.test]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
codegen-units = 16

[lints.clippy]
large_enum_variant = "allow"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
